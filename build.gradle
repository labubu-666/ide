plugins {
  id 'application'
  id 'org.openjfx.javafxplugin' version '0.1.0'
}

// Ensure Gradle compiles with a Java toolchain matching JavaFX 25
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'org.fxmisc.richtext', name: 'richtextfx', version: '0.11.7'
    implementation 'org.jetbrains.pty4j:pty4j:0.13.4'
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.23.1'
    implementation 'com.vladsch.flexmark:flexmark-all:0.64.8'
    implementation "de.marhali:json5-java:3.0.0"
    implementation 'org.eclipse.jgit:org.eclipse.jgit:7.6.0.202603022253-r'

    
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation "org.testfx:testfx-core:4.0.18"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.5.1'
    testImplementation "org.testfx:testfx-junit5:4.0.18"

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

javafx {
    version = "25.0.1"
    modules = [ 'javafx.controls', 'javafx.web' ]
}

application {
    mainClass = 'editor.Main'
}
