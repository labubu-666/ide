plugins {
  id 'application'
  id 'org.openjfx.javafxplugin' version '0.1.0'
}

// Ensure Gradle compiles with a Java toolchain matching JavaFX 25
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.fxmisc.richtext:richtextfx:0.11.7'
    implementation 'org.jetbrains.pty4j:pty4j:0.13.12'
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:1.0.0'
    implementation 'com.vladsch.flexmark:flexmark-all:0.64.8'
    implementation "de.marhali:json5-java:3.0.0"
    implementation 'org.eclipse.jgit:org.eclipse.jgit:7.6.0.202603022253-r'
    implementation 'org.slf4j:slf4j-api:2.0.18'
    implementation 'ch.qos.logback:logback-classic:1.6.2'

    
    testImplementation 'org.hamcrest:hamcrest:3.0'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation "org.testfx:testfx-core:4.0.18"
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.0.3'
    testImplementation "org.testfx:testfx-junit5:4.0.18"

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

javafx {
    version = "25.0.1"
    modules = [ 'javafx.controls', 'javafx.web' ]
}

application {
    mainClass = 'host.Main'
}

task runComponent(type: JavaExec) {
    group = 'application'
    description = 'Preview a UI component in isolation. Override the target with -Pcomponent=<fully.qualified.ClassName>.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = project.findProperty('component') ?: 'host.launcher.mounts.BranchButtonMount'
}
